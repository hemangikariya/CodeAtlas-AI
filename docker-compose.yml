version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: codeatlas_db
    environment:
      POSTGRES_DB: codeatlas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: codeatlas_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeatlas_api
    # Run migrations and then start the API gateway server
    command: >
      bash -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/code
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/codeatlas
      - ASYNC_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/codeatlas
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=replace-with-a-cryptographically-secure-key-minimum-32-characters
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeatlas_web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
